# Redirect subdomain admin lama ke domain utama
# Semua fitur hanya di https://griyasatumimika.web.id/
#
# Instalasi:
# sudo cp deploy/admin.griyasatumimika.web.id.conf /etc/nginx/sites-available/admin.griyasatumimika.web.id
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.griyasatumimika.web.id;

    ssl_certificate /etc/letsencrypt/live/admin.griyasatumimika.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.griyasatumimika.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://griyasatumimika.web.id$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.griyasatumimika.web.id;

    return 301 https://griyasatumimika.web.id$request_uri;
}
